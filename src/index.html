<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Piano GoatX · Aprende piano, gratis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta

      content="Aprende piano a tu ritmo, gratis y en español. Usa tu propio piano con el micrófono, un teclado USB o el de la pantalla."

    <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <body>
    <app-root>
      <!-- Pantalla mientras carga la app -->
      <div
        style="
          min-height: 100dvh;
          display: grid;
          place-items: center;
          font-family: 'Nunito', system-ui, sans-serif;
          font-size: 20px;
          font-weight: 700;
          color: #5a4f41;
          background: #f7f0e1;
        "
      >
        Afinando el piano…
